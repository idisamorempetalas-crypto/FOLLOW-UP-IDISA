<!DOCTYPE html>
<html lang="pt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IDISA · Presentes &amp; Experiências</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Fraunces:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6f0;--card:#fff;--ink:#2b1b1e;--mut:#8c7b78;--line:#eadfd0;--wine:#4a1020;--gold:#c8962e;--acc:#e8466b;--soft:#f3eadb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14090c;--card:#1f1115;--ink:#f4ebe0;--mut:#a8928f;--line:#3a2329;--soft:#2a171d}}
:root[data-theme=dark]{--bg:#14090c;--card:#1f1115;--ink:#f4ebe0;--mut:#a8928f;--line:#3a2329;--soft:#2a171d}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:14px/1.45 Manrope,system-ui,sans-serif;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--wine);z-index:30}
h1,h2,.serif{font-family:Fraunces,Georgia,serif}
button,input,select,textarea{font:inherit;color:inherit}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--soft);transition:.15s}
.btn:hover{transform:translateY(-1px)}.pri{background:linear-gradient(135deg,var(--wine),#8a1f45);color:#fff}.acc{background:var(--acc);color:#fff}.dng{color:#d03b4f}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(135deg,#3a0b18,var(--wine) 60%,#6d1a36);color:#f7f0e4;display:flex;align-items:center;gap:12px;padding:12px 20px}
.top .logo{font-family:Fraunces,serif;font-weight:800;font-size:22px;letter-spacing:.5px}.top small{color:#d9bf8e;letter-spacing:2px;font-size:10px;font-weight:800;display:block}
.top .sp{flex:1}.top .btn{background:rgba(255,255,255,.12);color:#f7f0e4;padding:8px 12px}
.wrap{max-width:1280px;margin:0 auto;padding:20px}
.hero{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.hero h1{margin:0;font-size:clamp(26px,4vw,40px);color:var(--wine)}@media (prefers-color-scheme:dark){.hero h1{color:#f4d9a8}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.k{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;position:relative;overflow:hidden}
.k b{display:block;font:800 32px Fraunces,serif;color:var(--wine)}@media (prefers-color-scheme:dark){.k b{color:#f4d9a8}}
.k span{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);font-weight:800}
.k::after{content:"";position:absolute;right:-18px;top:-18px;width:64px;height:64px;border-radius:50%;background:var(--gold);opacity:.18}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;font-weight:700;cursor:pointer;font-size:13px}
.chip.on{background:var(--wine);color:#fff;border-color:var(--wine)}.chip i{font-style:normal;opacity:.6;margin-left:6px;font-size:11px}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 14px}.tools input{flex:1;min-width:180px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px}
.pipe{display:flex;height:8px;border-radius:9px;overflow:hidden;background:var(--soft);margin-bottom:14px}.pipe div{transition:.4s}
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
th{text-align:left;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut);padding:12px;border-bottom:1px solid var(--line);background:var(--soft)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border:0}tr:hover td{background:color-mix(in srgb,var(--gold) 7%,transparent)}
.dt b{font:800 20px Fraunces,serif;color:var(--wine)}@media (prefers-color-scheme:dark){.dt b{color:#f4d9a8}}.dt small{color:var(--mut);margin-left:6px;font-weight:700}
.nm{font-weight:800}.mut{color:var(--mut)}.fl{color:#d03b4f;font-weight:700}
td a{color:inherit;text-decoration:none;border-bottom:1px dashed var(--mut)}
.today td:first-child{box-shadow:inset 4px 0 var(--acc)}.tag{background:var(--acc);color:#fff;border-radius:9px;font-size:9px;font-weight:800;padding:2px 7px;margin-left:6px;letter-spacing:1px}
select.st{border:0;border-radius:99px;padding:7px 10px;font-weight:800;font-size:12px;color:#fff;cursor:pointer;max-width:170px}
.acts{white-space:nowrap}.ic{border:0;background:none;cursor:pointer;font-size:16px;padding:6px;border-radius:8px}.ic:hover{background:var(--soft)}
.empty{text-align:center;padding:50px 10px;color:var(--mut)}
.ov{position:fixed;inset:0;background:rgba(20,5,10,.55);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.md{background:var(--card);border-radius:22px;padding:22px;width:min(560px,100%);max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.md h2{margin:0 0 14px;color:var(--wine)}@media (prefers-color-scheme:dark){.md h2{color:#f4d9a8}}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fg .full{grid-column:1/-1}
label{font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:800;color:var(--mut);display:block;margin-bottom:4px}
.md input,.md select,.md textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(900px 500px at 80% -10%,#8a1f45 0,transparent 60%),radial-gradient(700px 400px at 0 110%,#c8962e55 0,transparent 60%),#2a0810}
.lc{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(18px);border-radius:26px;padding:34px;width:min(400px,100%);color:#f7f0e4}
.lc h1{margin:0;font-size:56px;letter-spacing:1px}.lc p{color:#d9bf8e;margin:2px 0 22px;letter-spacing:3px;font-size:11px;font-weight:800}
.lc input{width:100%;margin-bottom:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);border-radius:12px;padding:13px;color:#fff}.lc .btn{width:100%;padding:13px}
.err{color:#ffb4bf;min-height:18px;font-size:13px}
@media(max-width:820px){thead{display:none}table,tbody,tr,td{display:block;border:0}table{background:none;border:0}
tr{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:12px;padding:10px 6px}td{padding:5px 12px}td[data-l]::before{content:attr(data-l);display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);font-weight:800}
.dt{display:flex;align-items:baseline}.acts{text-align:right}.today{box-shadow:inset 4px 0 var(--acc)}.today td:first-child{box-shadow:none}.fg{grid-template-columns:1fr}.wrap{padding:14px}.top{padding:10px 14px}}

.tl{height:36px;width:auto;filter:brightness(0) invert(1)}
.login.lt{background:#faf8f5}
.login.lt .lc{background:#fff;border:1px solid #eadfd0;color:#2b1b1e;box-shadow:0 20px 60px rgba(74,16,32,.12)}
.lc .ll{width:100%;max-width:300px;display:block;margin:0 auto 8px}
.lc .sub{text-align:center;color:#8c7b78;letter-spacing:3px;font-size:11px;font-weight:800;text-transform:uppercase;margin-bottom:22px}
.lc label{margin-top:6px;color:#8c7b78}
.login.lt .lc input{background:#faf6f0;border:1px solid #eadfd0;color:#2b1b1e}
.lc .err{color:#c0334a}
.pw{position:relative}.pw input{padding-right:48px}
.pw button{position:absolute;right:6px;top:4px;border:0;background:none;font-size:18px;cursor:pointer;padding:6px}
.rs{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px;margin-bottom:16px}.pn{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}.pn h3{margin:0 0 12px;font:800 11px Manrope,sans-serif;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut)}.fr{display:grid;grid-template-columns:110px 1fr 34px 38px;gap:8px;align-items:center;margin:10px 0;font-size:12.5px;font-weight:700}.fb{height:16px;background:var(--soft);border-radius:9px;overflow:hidden}.fb i{display:block;height:100%;border-radius:9px;transition:.5s}.fr small{color:var(--mut)}.dn{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.dn svg{width:140px;height:140px}.lg div{font-size:12px;margin:3px 0;font-weight:700}.lg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}.mbs{display:flex;gap:4px}.mb{flex:1;text-align:center}.mc{height:120px;display:flex;gap:1px;align-items:flex-end;justify-content:center}.mc i{width:30%;max-width:9px;border-radius:3px 3px 0 0;min-height:1px}.mb small{font-size:9px;color:var(--mut);font-weight:800}</style></head><body><div id="app"></div>
<script>
(function(){if(window.claude&&window.claude.use)return;
var K="idisa_db_v1",D={},L=[];try{D=JSON.parse(localStorage.getItem(K)||"{}")}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){alert("Sem espaço de armazenamento no navegador.")}}
function snapDoc(p){return{exists:p in D,id:p.split("/").pop(),data:function(){return D[p]}}}
function snapCol(c){var ks=Object.keys(D).filter(function(k){return k.indexOf(c+"/")===0});return{docs:ks.map(function(k){return{id:k.slice(c.length+1),data:function(){return D[k]}}})}}
function fire(l){l.cb(l.col?snapCol(l.path):snapDoc(l.path))}
function notify(){L.forEach(fire)}
function doc(p){return{set:function(v){D[p]=v;save();notify();return Promise.resolve()},
update:function(v){D[p]=Object.assign({},D[p],v);save();notify();return Promise.resolve()},
delete:function(){delete D[p];save();notify();return Promise.resolve()},
onSnapshot:function(cb){var l={cb:cb,path:p};L.push(l);setTimeout(function(){fire(l)},0);return function(){L=L.filter(function(x){return x!==l})}}}}
function col(c){return{add:function(v){var id="r"+Date.now()+Math.floor(Math.random()*1e4);return doc(c+"/"+id).set(v)},
onSnapshot:function(cb){var l={cb:cb,path:c,col:1};L.push(l);setTimeout(function(){fire(l)},0);return function(){L=L.filter(function(x){return x!==l})}}}}
var db={doc:doc,collection:col};
var dl={save:function(o){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([o.data],{type:"text/csv;charset=utf-8"}));a.download=o.filename;document.body.appendChild(a);a.click();a.remove();return Promise.resolve()}};
window.claude={use:function(n){return Promise.resolve(n==="db"?db:n==="downloads"?dl:null)}};
})();
</script>

 <div class="kpis"><div class="k"><b>${tot}</b><span>Registos</span></div><div class="k"><b>${wait}</b><span>Em conversa</span></div><div class="k"><b>${done}</b><span>Tratados</span></div><div class="k"><b>${sold}</b><span>Vendidos</span></div><div class="k"><b>${tot?Math.round(sold/tot*100):0}%</b><span>Conversão</span></div></div>${charts(all)}
 <div class="pipe">${ST.map(s=>`<div style="width:${tot?cnt(s[0])/tot*100:0}%;background:${s[2]}"></div>`).join("")}</div>
 <div class="chips"><button class="chip ${fm==="all"?"on":""}" data-m="all">Todos<i>${all.length}</i></button>${MES.map((n,i)=>`<button class="chip ${fm===i+1?"on":""}" data-m="${i+1}">${n.slice(0,3)}<i>${mc(i+1)}</i></button>`).join("")}<button class="chip ${fm===0?"on":""}" data-m="0">Sem data<i>${mc(0)}</i></button></div>
 <div class="chips">${ST.map(s=>`<button class="chip ${fs===s[0]?"on":""}" data-s="${s[0]}"><span style="color:${s[2]}">●</span> ${s[1]}<i>${cnt(s[0])}</i></button>`).join("")}</div>
 <div class="tools"><input id="q" placeholder="Pesquisar nome, telefone, ocasião…" value="${esc(q)}"></div>
 ${list.length?`<table><thead><tr><th>Data</th><th>Contacto</th><th>Telefone</th><th>Ocasião</th><th>Observações</th>${cols.map(c=>`<th>${esc(c.label)}</th>`).join("")}<th>Estado</th><th></th></tr></thead><tbody>${list.map(row).join("")}</tbody></table>`:'<div class="empty"><h2 class="serif">Nada por aqui</h2>Sem registos para este filtro.</div>'}</div>`;
 const qi=$("#q");qi.oninput=e=>{q=e.target.value.toLowerCase();const p=qi.selectionStart;app();const n=$("#q");n.focus();n.setSelectionRange(p,p)}}
function charts(all){const n=all.length;if(!n)return"";const c=k=>all.filter(r=>(r.status||"pendente")===k).length,sold=c("vendido"),resp=c("respondeu")+sold+c("sem"),sent=c("enviada")+c("aguardando")+resp,pc=(a,b)=>b?Math.round(a/b*100):0,
 F=[["Registos",n,"#4a1020"],["Mensagem enviada",sent,"#2f6fe4"],["Responderam",resp,"#7a4fb0"],["Vendidos",sold,"#b8860b"]];
 let off=0;const seg=ST.map(s=>{const v=c(s[0])/n*100,e=`<circle r="15.9155" cx="21" cy="21" fill="none" stroke="${s[2]}" stroke-width="6" stroke-dasharray="${v} ${100-v}" stroke-dashoffset="${-off}" transform="rotate(-90 21 21)"/>`;off+=v;return e}).join("");
 const M=MES.map((_,i)=>{const r=all.filter(x=>x.m===i+1),s=r.filter(x=>["enviada","aguardando","respondeu","vendido","sem"].includes(x.status)).length;return[r.length,s,r.filter(x=>x.status==="vendido").length]}),mx=Math.max(1,...M.map(m=>m[0]));
 return`<div class="rs"><div class="pn"><h3>Funil de resultados</h3>${F.map(f=>`<div class="fr"><span>${f[0]}</span><div class="fb"><i style="width:${f[1]?Math.max(f[1]/n*100,2):0}%;background:${f[2]}"></i></div><b>${f[1]}</b><small>${pc(f[1],n)}%</small></div>`).join("")}<p class="mut" style="margin:12px 0 0;font-size:12px">Taxa de resposta: <b>${pc(resp,sent)}%</b> das mensagens enviadas · Vendas: <b>${pc(sold,sent)}%</b> das mensagens enviadas</p></div><div class="pn"><h3>Estado dos contactos</h3><div class="dn"><svg viewBox="0 0 42 42"><circle r="15.9155" cx="21" cy="21" fill="none" stroke="var(--soft)" stroke-width="6"/>${seg}<text x="21" y="22.5" text-anchor="middle" font-size="7" font-weight="800" fill="currentColor">${pc(sold,n)}%</text><text x="21" y="27" text-anchor="middle" font-size="2.8" fill="currentColor" opacity=".6">VENDIDOS</text></svg><div class="lg">${ST.map(s=>`<div><i style="background:${s[2]}"></i>${s[1]} · <b>${c(s[0])}</b></div>`).join("")}</div></div></div><div class="pn" style="grid-column:1/-1"><h3>Por mês &nbsp;<span style="color:#4a1020">■</span> Registos &nbsp;<span style="color:#2f6fe4">■</span> Enviadas &nbsp;<span style="color:#b8860b">■</span> Vendidos</h3><div class="mbs">${M.map((m,i)=>`<div class="mb"><div class="mc" title="${MES[i]}: ${m[0]} registos, ${m[1]} enviadas, ${m[2]} vendidos"><i style="height:${m[0]/mx*100}%;background:#4a1020"></i><i style="height:${m[1]/mx*100}%;background:#2f6fe4"></i><i style="height:${m[2]/mx*100}%;background:#b8860b"></i></div><small>${MES[i].slice(0,3)}</small></div>`).join("")}</div></div></div>`}
function row(r){const t=r.m===CM&&String(r.day)===String(CD),fl=/onfirmar|verificar|Sem telefone/.test(r.obs||""),d=String(r.tel||"").replace(/\D/g,""),s=stc(r.status);
 return`<tr class="${t?"today":""}" data-id="${r.id}"><td class="dt" data-l="Data">${r.m?`<b>${esc(r.day)}</b><small>${MES[r.m-1].slice(0,3)}</small>`:'<span class="mut">—</span>'}${t?'<span class="tag">HOJE</span>':""}</td><td class="nm" data-l="Contacto">${esc(r.name)}</td><td data-l="Telefone">${d?`<a href="tel:${d}">${esc(r.tel)}</a>${d.length===9?` <a href="https://wa.me/244${d}" target="_blank" rel="noopener" title="WhatsApp">💬</a>`:""}`:'<span class="mut">—</span>'}</td><td data-l="Ocasião">${esc(r.occ)}</td><td data-l="Observações" class="${fl?"fl":"mut"}">${esc(r.obs)}</td>${cols.map(c=>`<td data-l="${esc(c.label)}">${esc((r.x||{})[c.id])}</td>`).join("")}<td data-l="Estado"><select class="st" data-a="st" style="background:${s[2]}">${ST.map(o=>`<option value="${o[0]}" ${o[0]===s[0]?"selected":""}>${o[1]}</option>`).join("")}</select></td><td class="acts"><button class="ic" data-a="edit" title="Editar">✏️</button><button class="ic" data-a="del" title="Apagar">🗑️</button></td></tr>`}
function modalShow(h){const o=document.createElement("div");o.className="ov";o.innerHTML=`<div class="md">${h}</div>`;o.onclick=e=>{if(e.target===o)o.remove()};document.body.appendChild(o);return o}
function form(id){const r=id?rows.get(id):{m:fm===0||fm==="all"?CM:fm,status:"pendente"};
 const o=modalShow(`<h2 class="serif">${id?"Editar registo":"Novo registo"}</h2><div class="fg"><div class="full"><label>Contacto</label><input id="f_name" value="${esc(r.name)}"></div><div><label>Telefone</label><input id="f_tel" inputmode="tel" value="${esc(r.tel)}"></div><div><label>Estado</label><select id="f_st">${ST.map(s=>`<option value="${s[0]}" ${s[0]===(r.status||"pendente")?"selected":""}>${s[1]}</option>`).join("")}</select></div><div><label>Mês</label><select id="f_m"><option value="0">Sem data</option>${MES.map((n,i)=>`<option value="${i+1}" ${r.m===i+1?"selected":""}>${n}</option>`).join("")}</select></div><div><label>Dia</label><input id="f_day" value="${esc(r.day)}"></div><div class="full"><label>Ocasião</label><input id="f_occ" value="${esc(r.occ)}"></div><div class="full"><label>Observações</label><textarea id="f_obs" rows="2">${esc(r.obs)}</textarea></div>${cols.map(c=>`<div><label>${esc(c.label)}</label><input data-x="${c.id}" value="${esc((r.x||{})[c.id])}"></div>`).join("")}</div><div class="row"><button class="btn" id="c">Cancelar</button><button class="btn pri" id="s">Guardar</button></div>`);
 $("#c").onclick=()=>o.remove();$("#s").onclick=async()=>{const x={};o.querySelectorAll("[data-x]").forEach(i=>x[i.dataset.x]=i.value);
  const v={name:$("#f_name").value.trim(),tel:$("#f_tel").value.trim(),status:$("#f_st").value,m:+$("#f_m").value,day:$("#f_day").value.trim(),occ:$("#f_occ").value.trim(),obs:$("#f_obs").value.trim(),x,upd:Date.now(),by:me.name||me.user};
  if(!v.name)return;o.remove();id?await db.doc("rows/"+id).update(v):await db.collection("rows").add(v)}}
function team(){const o=modalShow(`<h2 class="serif">Equipa</h2>${[...users].map(([u,r])=>`<div class="row" style="justify-content:space-between;margin:6px 0"><span><b>${esc(r.name)}</b> <span class="mut">@${esc(u)} · ${r.role==="admin"?"admin":"equipa"}</span></span>${u!==me.user?`<button class="ic" data-u="${esc(u)}">🗑️</button>`:""}</div>`).join("")}<hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><div class="fg"><div><label>Nome</label><input id="t_n"></div><div><label>Utilizador</label><input id="t_u" autocapitalize="none"></div><div><label>Senha</label><input id="t_p" type="password"></div><div><label>Perfil</label><select id="t_r"><option value="user">Equipa</option><option value="admin">Admin</option></select></div></div><div class="row"><button class="btn" id="c">Fechar</button><button class="btn pri" id="s">Adicionar</button></div>`);
 o.querySelectorAll("[data-u]").forEach(b=>b.onclick=async()=>{if(confirm("Remover acesso?")){await db.doc("users/"+b.dataset.u).delete();o.remove();team()}});
 $("#c").onclick=()=>o.remove();$("#s").onclick=async()=>{const u=$("#t_u").value.trim().toLowerCase().replace(/[^a-z0-9._-]/g,""),p=$("#t_p").value;if(!u||p.length<6)return alert("Utilizador e senha (mín. 6).");const salt=crypto.randomUUID();await db.doc("users/"+u).set({name:$("#t_n").value.trim()||u,salt,hash:await H(salt+p),role:$("#t_r").value});o.remove();team()}}
function colsM(){const o=modalShow(`<h2 class="serif">Colunas personalizadas</h2>${cols.map(c=>`<div class="row" style="justify-content:space-between;margin:6px 0"><b>${esc(c.label)}</b><button class="ic" data-c="${c.id}">🗑️</button></div>`).join("")||'<p class="mut">Ainda sem colunas extra.</p>'}<div class="fg"><div class="full"><label>Nova coluna</label><input id="n" placeholder="Ex.: Presente, Valor, Morada…"></div></div><div class="row"><button class="btn" id="c">Fechar</button><button class="btn pri" id="s">Adicionar</button></div>`);
 o.querySelectorAll("[data-c]").forEach(b=>b.onclick=async()=>{if(confirm("Remover coluna? Os valores ficam guardados mas deixam de aparecer.")){await db.doc("config/cols").set({list:cols.filter(c=>c.id!==b.dataset.c)});o.remove();colsM()}});
 $("#c").onclick=()=>o.remove();$("#s").onclick=async()=>{const l=$("#n").value.trim();if(!l)return;await db.doc("config/cols").set({list:[...cols,{id:"c"+Date.now().toString(36),label:l}]});o.remove();colsM()}}
async function seed(){modal="busy";await db.doc("config/meta").set({seeded:Date.now()});const o=modalShow('<h2 class="serif">A carregar contactos…</h2><p id="pg">0 / '+SEED.length+'</p>');
 for(let i=0;i<SEED.length;i++){const[m,day,name,tel,occ,obs]=SEED[i];await db.doc("rows/r"+String(i+1).padStart(3,"0")).set({m,day,name,tel,occ,obs,status:"pendente",x:{},upd:Date.now(),by:me.name||me.user});if(i%10==0)$("#pg").textContent=(i+1)+" / "+SEED.length}
 o.remove();modal="";draw()}
async function csv(){const dl=await claude.use("downloads");if(!dl)return alert("Exportação indisponível.");const e=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
 const L=[["Mês","Dia","Contacto","Telefone","Ocasião","Observações","Estado",...cols.map(c=>c.label)].map(e).join(";")];
 scope().sort((a,b)=>(a.m||99)-(b.m||99)||dn(a)-dn(b)).forEach(r=>L.push([r.m?MES[r.m-1]:"Sem data",r.day,r.name,r.tel,r.occ,r.obs,stc(r.status)[1],...cols.map(c=>(r.x||{})[c.id])].map(e).join(";")));
 try{await dl.save({filename:"IDISA_base_contactos.csv",data:"\ufeff"+L.join("\n")})}catch(x){}}
document.addEventListener("click",async e=>{const t=e.target.closest("[data-a],[data-m],[data-s]");if(!t)return;
 if(t.dataset.m!==undefined){fm=t.dataset.m==="all"?"all":+t.dataset.m;return app()}
 if(t.dataset.s){fs=fs===t.dataset.s?"":t.dataset.s;return app()}
 const id=t.closest("tr")?.dataset.id,a=t.dataset.a;
 if(a==="out"){try{localStorage.removeItem("idisa_u")}catch(x){}me=null;draw()}
 else if(a==="new")form();else if(a==="edit")form(id);else if(a==="team")team();else if(a==="cols")colsM();else if(a==="csv")csv();else if(a==="seed")seed();
 else if(a==="del"&&confirm("Apagar este registo?"))await db.doc("rows/"+id).delete()});
document.addEventListener("change",async e=>{const t=e.target;if(t.dataset.a==="st"){await db.doc("rows/"+t.closest("tr").dataset.id).update({status:t.value,upd:Date.now(),by:me.name||me.user})}});
boot();
</script></body></html>
